<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فريق الهلال البريمي الرياضي الثقافي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* لوحة الألوان: أبيض سائد + أزرق زجاجي شفاف */
      --bg-white: #ffffff;
      --blue-deep: #124e8c;
      --blue-glass-accent: #2276cc;
      --blue-glass-fill: linear-gradient(145deg, rgba(235, 246, 255, 0.78), rgba(196, 226, 255, 0.42));
      --blue-glass-card: linear-gradient(145deg, rgba(242, 249, 255, 0.82), rgba(212, 234, 255, 0.45));
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-blue-edge: rgba(34, 118, 204, 0.22);
      --text-dark: #0e2439;
      --text-muted: #46627d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-white);
      color: var(--text-dark);
      line-height: 1.75;
      overflow-x: hidden;
      position: relative;
    }

    /* إضاءات خلفية زرقاء ناعمة لإبراز انعكاس الزجاج الشفاف فوق الأبيض */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background: #ffffff;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: rgba(56, 152, 245, 0.16);
      top: -60px;
      right: 8%;
    }

    .orb-2 {
      width: 340px;
      height: 340px;
      background: rgba(24, 119, 214, 0.13);
      top: 32%;
      left: 6%;
    }

    .orb-3 {
      width: 400px;
      height: 400px;
      background: rgba(82, 170, 255, 0.14);
      bottom: 5%;
      right: 15%;
    }

    /* ================= شريط التنقل الزجاجي ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(235, 246, 255, 0.72));
      backdrop-filter: blur(22px) saturate(190%);
      -webkit-backdrop-filter: blur(22px) saturate(190%);
      border-bottom: 1px solid var(--glass-blue-edge);
      box-shadow: 0 4px 20px rgba(18, 78, 140, 0.05);
    }

    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-dark);
    }

    .brand-logo-wrap {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--blue-glass-fill);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 12px rgba(34, 118, 204, 0.14), inset 0 1px 1px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-logo-wrap img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    .brand-text strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--blue-deep);
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.35rem 0.75rem;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    nav a:hover {
      color: var(--blue-glass-accent);
      background: rgba(34, 118, 204, 0.08);
    }

    .menu-toggle {
      display: none;
      background: var(--blue-glass-fill);
      border: 1px solid var(--glass-blue-edge);
      color: var(--blue-deep);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 1.3rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(34, 118, 204, 0.10);
    }

    /* ================= الواجهة الرئيسية (Hero) ================= */
    .hero {
      position: relative;
      padding: 4.5rem 1.25rem 4rem;
      text-align: center;
    }

    .hero-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* إطار الشعار الزجاجي الأزرق */
    .hero-logo-card {
      position: relative;
      width: 162px;
      height: 162px;
      border-radius: 36px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.90), rgba(204, 231, 255, 0.52));
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1.5px solid var(--glass-border);
      box-shadow:
        0 20px 45px rgba(34, 118, 204, 0.16),
        0 4px 12px rgba(18, 78, 140, 0.06),
        inset 0 2px 2px rgba(255, 255, 255, 1),
        inset 0 -2px 6px rgba(34, 118, 204, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin-bottom: 1.65rem;
    }

    .hero-logo-card::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 10px;
      right: 10px;
      height: 42%;
      border-radius: 28px 28px 14px 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .hero-logo-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    .logo-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--blue-deep);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .badge-pill {
      display: inline-block;
      padding: 0.35rem 1.15rem;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(226, 242, 255, 0.85), rgba(196, 226, 255, 0.55));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 14px rgba(34, 118, 204, 0.10);
      color: var(--blue-deep);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.9rem;
    }

    .hero h1 {
      font-size: clamp(1.75rem, 4vw, 2.55rem);
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 1.1rem;
      line-height: 1.3;
    }

    .hero h1 span {
      color: var(--blue-glass-accent);
    }

    /* بطاقة الكلمة التعريفية الزجاجية */
    .intro-box {
      background: linear-gradient(145deg, rgba(244, 250, 255, 0.85), rgba(214, 236, 255, 0.45));
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 12px 32px rgba(34, 118, 204, 0.09),
        inset 0 1.5px 1px rgba(255, 255, 255, 1);
      border-radius: 24px;
      padding: 1.4rem 1.7rem;
      margin-bottom: 2.1rem;
    }

    .intro-box p {
      color: var(--text-muted);
      font-size: 1.03rem;
    }

    .intro-box strong {
      color: var(--blue-deep);
    }
